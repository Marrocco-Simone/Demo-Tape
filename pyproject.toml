[project]
name = "demo-tape"
version = "0.1.0"
description = "Deterministic browser demo recorder: run a JSON action pipeline in Chromium, record an MP4. No LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "browser-use[video]>=0.13.8",
    "pydantic>=2.0",
]

[project.optional-dependencies]
tts = [
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "huggingface-hub>=0.20",
]

[project.scripts]
demotape = "demotape.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["demotape*"]
