<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>demo-record test app</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    .hero { height: 120vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(#6d28d9, #2563eb); color: #fff; }
    button { font-size: 1.1rem; padding: 0.6rem 1.2rem; border-radius: 8px; border: 0; cursor: pointer; }
    .form { min-height: 100vh; display: flex; flex-direction: column; gap: 1rem; align-items: center; justify-content: center; background: #f8fafc; }
    input, select { font-size: 1rem; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; width: 280px; }
    #welcome { display: none; color: #16a34a; font-weight: 700; font-size: 1.4rem; }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Test App</h1>
    <p>Scroll target below the fold.</p>
    <button id="get-started">Get started</button>
    <button id="mousedown-only">Mousedown only</button>
    <a id="anchor-nav" href="#form-section">Anchor link</a>
    <p id="md-status">row untouched</p>
  </section>

  <section class="form" id="form">
    <h2>Sign up</h2>
    <input name="email" type="email" placeholder="Email" />
    <select id="plan">
      <option value="">Choose a plan…</option>
      <option value="free">Free</option>
      <option value="pro">Pro</option>
    </select>
    <button id="continue">Continue</button>
    <div id="welcome">Welcome</div>
  </section>

  <script>
    document.getElementById('get-started').addEventListener('click', () => {
      document.getElementById('form').scrollIntoView({ behavior: 'smooth' });
    });
    document.getElementById('continue').addEventListener('click', () => {
      document.getElementById('welcome').style.display = 'block';
    });
  </script>
<script>
  // Regression control for the click rewrite: reacts to mousedown only, the
  // pattern el.click() could never trigger.
  document.getElementById('mousedown-only').addEventListener('mousedown', () => {
    document.getElementById('md-status').textContent = 'row activated';
  });
  // A hashchange proves the anchor's navigation actually ran (activation
  // behavior), not just that a click listener fired.
  window.addEventListener('hashchange', () => {
    document.getElementById('md-status').textContent = 'anchor navigated';
  });
</script>
</body>
</html>
