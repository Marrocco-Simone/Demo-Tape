<!doctype html>
<html>
<head><meta charset="utf-8"><title>Router test</title></head>
<body>
  <h1>Router</h1>
  <nav>
    <a href="#/home" id="nav-home">Home</a>
    <a href="#/one" id="nav-one">One</a>
    <a href="#/two" id="nav-two">Two</a>
  </nav>
  <div id="view">home view</div>
  <script>
    const names = { '#/home': 'home view', '#/one': 'one view', '#/two': 'two view' };
    const render = () => {
      document.getElementById('view').textContent = names[location.hash] || 'home view';
    };
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
