<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slider test</title>
<style>
  body { font-family: sans-serif; padding: 60px; }
  .track-outer { width: 100%; height: 40px; justify-content: center; display: flex; }
  .slider { flex: 1 1 auto; display: flex; flex-direction: row; z-index: 1; align-items: center; }
  .fill { height: 4px; background-color: rgb(36,74,151); border-radius: 2px; flex-grow: 0; }
  .thumb { width: 20px; height: 20px; background-color: rgb(36,74,151); border-radius: 10px; z-index: 1; flex-shrink: 0; }
  .rest { height: 4px; background-color: rgb(203,213,225); border-radius: 2px; flex-grow: 100; }
  .rest { flex-grow: 0.001; }
</style>
</head>
<body>
  <h1>Evaluate Product</h1>
  <p>Sweetness</p>
  <div class="track-outer">
    <div role="slider" class="slider" style="width:416px;">
      <div class="fill" id="fill"></div>
      <div class="thumb"></div>
      <div class="rest" id="rest"></div>
    </div>
  </div>
  <p id="value">Sweetness 0</p>

  <h1 style="margin-top:60px;">Board</h1>
  <p id="order">Order: Design, Build, Ship</p>
  <ul id="list" style="list-style:none; padding:0; width:300px;">
    <li class="card" id="card-design" style="margin:8px 0; padding:16px; background:#e2e8f0; border-radius:8px; cursor:grab; user-select:none;">Design</li>
    <li class="card" id="card-build" style="margin:8px 0; padding:16px; background:#e2e8f0; border-radius:8px; cursor:grab; user-select:none;">Build</li>
    <li class="card" id="card-ship" style="margin:8px 0; padding:16px; background:#e2e8f0; border-radius:8px; cursor:grab; user-select:none;">Ship</li>
  </ul>
  <script>
    const slider = document.querySelector('[role="slider"]');
    const fill = document.getElementById('fill');
    const rest = document.getElementById('rest');
    let value = 0;
    const render = () => {
      fill.style.flexGrow = String(value * 100);
      rest.style.flexGrow = String((1 - value) * 100);
      document.getElementById('value').textContent = 'Sweetness ' + Math.round(value * 100);
    };
    let dragging = false;
    const read = (pageX) => {
      const r = slider.getBoundingClientRect();
      value = Math.min(1, Math.max(0, (pageX - (r.x + window.scrollX)) / r.width));
      render();
    };
    slider.addEventListener('mousedown', (e) => { dragging = true; read(e.pageX); });
    window.addEventListener('mousemove', (e) => { if (dragging) read(e.pageX); });
    window.addEventListener('mouseup', (e) => { if (dragging) { dragging = false; read(e.pageX); } });
    render();
  </script>
  <script>
    const list = document.getElementById('list');
    let dragEl = null;
    list.addEventListener('mousedown', (e) => {
      dragEl = e.target.closest('.card');
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragEl) return;
      const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.card');
      if (!over || over === dragEl) return;
      // FLIP: snapshot positions, reorder, play the swap as a transform
      // transition — like dnd-kit/SortableJS do, instead of snapping.
      const cards = [...list.querySelectorAll('.card')];
      const first = new Map(cards.map(el => [el, el.getBoundingClientRect().top]));
      const r = over.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      list.insertBefore(dragEl, before ? over : over.nextSibling);
      for (const el of cards) {
        const dy = first.get(el) - el.getBoundingClientRect().top;
        if (!dy) continue;
        el.style.transition = 'none';
        el.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(() => {
          el.style.transition = 'transform 180ms cubic-bezier(0.2, 0.7, 0.3, 1)';
          el.style.transform = '';
        });
      }
    });
    window.addEventListener('mouseup', () => {
      if (!dragEl) return;
      dragEl = null;
      const names = [...list.querySelectorAll('.card')].map(el => el.textContent.trim());
      document.getElementById('order').textContent = 'Order: ' + names.join(', ');
    });
  </script>
</body>
</html>
